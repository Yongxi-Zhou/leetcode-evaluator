# ============================================================
# LeetCode Batch Evaluation - Multi-Account Docker Runner
#
# Each service uses a different LeetCode account (cookies) to
# stay under the ~500 submissions/day per-account limit.
#
# SETUP:
#   Copy .env.example to .env.a, .env.b, .env.c
#   Fill in LEETCODE_SESSION_COOKIE + LEETCODE_CSRF_TOKEN for each account.
#   The other keys (DASHSCOPE_API_KEY etc.) are shared via .env.
#
# ROUND 1  (500 submissions each):
#   docker compose up
#
# ROUND 2  (edit ARGS_* below, then):
#   docker compose up
#
# Logs: output/logs/account-{a,b,c}_<timestamp>.log
# ============================================================

x-common: &common
  build: .
  working_dir: /app
  entrypoint: ["sh", "-c"]
  volumes:
    - ./output:/app/output
    - ./dataset:/app/dataset
    - ./experiments:/app/experiments
  env_file:
    - .env          # shared: DASHSCOPE_API_KEY, MODEL_TEMPERATURE, etc.

# ── ROUND 1 commands ──────────────────────────────────────────
# account-a: qwen-max  problems 50-99  (first 50 already done, resume)
# account-b: qwq-plus  problems  0-49
# account-c: qwen-plus problems  0-49

services:
  account-a:
    <<: *common
    env_file:
      - .env
      - .env.a       # overrides: LEETCODE_SESSION_COOKIE, LEETCODE_CSRF_TOKEN
    command:
      - "mkdir -p /app/output/logs && python3 main.py --qwen-batch-config experiments/paper_qwen_batch.json --qwen-batch-run-id qwen_batch_paper_qwen_batch_608ffde791 --qwen-batch-mode resume --batch-models qwen-max --batch-problem-offset 50 --batch-num-problems 50 2>&1 | tee /app/output/logs/account-a_qwen-max_$(date +%Y%m%d_%H%M%S).log"

  account-b:
    <<: *common
    env_file:
      - .env
      - .env.b
    command:
      - "mkdir -p /app/output/logs && python3 main.py --qwen-batch-config experiments/paper_qwen_batch.json --qwen-batch-run-id qwen_batch_paper_qwen_batch_608ffde791 --qwen-batch-mode resume --batch-models qwq-plus --batch-num-problems 50 2>&1 | tee /app/output/logs/account-b_qwq-plus_$(date +%Y%m%d_%H%M%S).log"

  account-c:
    <<: *common
    env_file:
      - .env
      - .env.c
    command:
      - "mkdir -p /app/output/logs && python3 main.py --qwen-batch-config experiments/paper_qwen_batch.json --qwen-batch-run-id qwen_batch_paper_qwen_batch_608ffde791 --qwen-batch-mode resume --batch-models qwen-plus --batch-num-problems 50 2>&1 | tee /app/output/logs/account-c_qwen-plus_$(date +%Y%m%d_%H%M%S).log"

# ── ROUND 2 commands (edit before running) ────────────────────
# account-a: qwq-plus  problems 50-99
# account-b: qwen-plus problems 50-99
# account-c: qwen-turbo problems  0-49
#
# Change commands above to (keep --qwen-batch-run-id qwen_batch_paper_qwen_batch_608ffde791):
#   account-a: "... python3 main.py --qwen-batch-run-id qwen_batch_paper_qwen_batch_608ffde791 --batch-models qwq-plus  --batch-problem-offset 50 --batch-num-problems 50 ..."
#   account-b: "... python3 main.py --qwen-batch-run-id qwen_batch_paper_qwen_batch_608ffde791 --batch-models qwen-plus --batch-problem-offset 50 --batch-num-problems 50 ..."
#   account-c: "... python3 main.py --qwen-batch-run-id qwen_batch_paper_qwen_batch_608ffde791 --batch-models qwen-turbo --batch-num-problems 50 ..."

# ── ROUND 3 (single container) ────────────────────────────────
# account-a: qwen-turbo problems 50-99
#   "... python3 main.py --qwen-batch-run-id qwen_batch_paper_qwen_batch_608ffde791 --batch-models qwen-turbo --batch-problem-offset 50 --batch-num-problems 50 ..."
